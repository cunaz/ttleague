name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensitive:
    name: Sensible Inhalte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Keine KI-Verläufe, Zugangsdaten oder lokalen Pfade
        run: bin/check-sensitive.sh --all

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: ttleague_test
          MARIADB_USER: ttleague
          MARIADB_PASSWORD: ttleague
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TTLEAGUE_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=ttleague_test;charset=utf8mb4
      TTLEAGUE_TEST_DB_USER: ttleague
      TTLEAGUE_TEST_DB_PASS: ttleague
      # Eigene Datenbank: Die WordPress-Testsuite löscht und installiert ihre Tabellen bei jedem Lauf.
      TTLEAGUE_WP_TEST_DB_NAME: ttleague_wptest
      TTLEAGUE_WP_TEST_DB_HOST: 127.0.0.1:3306
      TTLEAGUE_WP_TEST_DB_USER: ttleague
      TTLEAGUE_WP_TEST_DB_PASS: ttleague
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: PHP einrichten
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, json, intl, mysqli, pdo_mysql
          coverage: none

      - name: Abhängigkeiten installieren
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Tests
        run: composer test

      - name: Datenbank für die WordPress-Tests
        run: >-
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -proot -e
          "CREATE DATABASE IF NOT EXISTS ttleague_wptest CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT ALL ON ttleague_wptest.* TO 'ttleague'@'%';"

      - name: WordPress-Tests
        run: composer test:wp

      - name: Coding Standards
        if: matrix.php == '8.3'
        run: composer lint
