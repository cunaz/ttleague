# Deaktiviert automatische Reviews und Statusmeldungen, solange die GitHub-App Zugriff hat.
enable_free_tier: false
reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
  review_status: false
  review_progress: false
  commit_status: false
chat:
  auto_reply: false
issue_enrichment:
  auto_enrich:
    enabled: false
